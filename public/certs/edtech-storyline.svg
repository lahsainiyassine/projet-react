      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadowEdTech" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="#0f172a"/>
  <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="url(#edtechGrad)" filter="url(#shadowEdTech)"/>
  <polygon points="200,55 325,127 325,273 200,345 75,273 75,127" fill="#0f172a"/>
  <!-- Gamepad / Interactive EdTech Icon -->
  <rect x="145" y="165" width="110" height="65" rx="20" fill="none" stroke="#2dd4bf" stroke-width="7"/>
