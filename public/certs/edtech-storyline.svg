  <circle cx="220" cy="190" r="4.5" fill="#38bdf8"/>
  <circle cx="232" cy="200" r="4.5" fill="#10b981"/>
  <!-- Text -->
  <text x="200" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">SERIOUS GAMES</text>
  <text x="200" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="3">EDTECH DESIGN</text>
</svg>
