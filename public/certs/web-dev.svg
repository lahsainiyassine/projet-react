<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadowWeb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="#0f172a"/>
  <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="url(#webGrad)" filter="url(#shadowWeb)"/>
  <polygon points="200,55 325,127 325,273 200,345 75,273 75,127" fill="#0f172a"/>
  <!-- Code Brackets & Web Window -->
  <rect x="145" y="150" width="110" height="85" rx="10" fill="none" stroke="#60a5fa" stroke-width="6"/>
  <line x1="145" y1="172" x2="255" y2="172" stroke="#60a5fa" stroke-width="4"/>
  <circle cx="160" cy="161" r="3.5" fill="#ef4444"/>
  <circle cx="172" cy="161" r="3.5" fill="#f59e0b"/>
  <circle cx="184" cy="161" r="3.5" fill="#10b981"/>
  <!-- Brackets inside window -->
  <path d="M175 190 L165 200 L175 210" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M225 190 L235 200 L225 210" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="205" y1="188" x2="195" y2="212" stroke="#a78bfa" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Text -->
  <text x="200" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">FULL-STACK WEB</text>
  <text x="200" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="3">JAVASCRIPT &amp; REACT</text>
</svg>
